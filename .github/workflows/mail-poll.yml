name: Mail poll (Hostinger IMAP → Supabase)

on:
  schedule:
    # GitHub Actions cron minimum interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # allow manual "Run workflow" from Actions tab

# Don't queue overlapping runs — if a poll is already running, skip the next.
concurrency:
  group: mail-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: mail-poll
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Poll IMAP and ingest
        working-directory: mail-poll
        env:
          MAIL_INGEST_URL: https://yhtzxkhfqzuaafvappln.supabase.co/functions/v1/mail-ingest
          MAIL_INGEST_SECRET: ${{ secrets.MAIL_INGEST_SECRET }}
          HOSTINGER_EMAIL: office@barabashflow.pl
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          IMAP_HOST: imap.hostinger.com
          IMAP_PORT: '993'
        run: node poll.js
