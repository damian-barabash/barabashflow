name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Blog worker on the Mac Studio fires this after publishing new posts so the
  # static pages regenerate. The daily cron is a best-effort fallback (GH
  # schedules are unreliable) that picks up posts even without the dispatch.
  # It must run AFTER both agent windows (08:40 + 13:40 Warsaw = 06:40 + 11:40
  # UTC in summer) — the old 05:20 UTC slot built the site before the agent
  # published and the day's posts never appeared (2026-07-05 incident).
  repository_dispatch:
    types: [blog-publish]
  # Two slots: GH skips scheduled runs often enough that a single daily slot
  # is a real single point of failure when the dispatch path is down too
  # (2026-08-03: expired PAT → dispatch 401, only the cron could save the day).
  schedule:
    - cron: "30 12 * * *"
    - cron: "45 17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # Machine-readable stamp served at /build.json — the verify step below
      # (and anyone debugging) can tell WHICH run's output is actually live.
      # Needed because on 2026-07-06 a deployment reported success while the
      # CDN kept serving the previous build.
      - name: Stamp build
        run: |
          printf '{"run_id":"%s","run_attempt":"%s","built_at":"%s"}\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "$(date -u +%FT%TZ)" > dist/build.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages deployments intermittently fail server-side ("Deployment
        # failed, try again later") and succeed on a fresh attempt a moment
        # later — don't fail the run yet, retry below.
        continue-on-error: true
        with:
          error_count: 15
          timeout: 600000

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
          timeout: 600000

      # A "successful" deployment is not proof the site updated: on 2026-07-06
      # deploy-pages and the Pages API both said success while the live site
      # kept serving yesterday's build. Trust only the content: poll
      # /build.json until it carries THIS run's id (cache-buster query dodges
      # Fastly's max-age=600), redeploy once if stale, and fail the run loudly
      # if it is still stale — a red run beats a silently missing blog post.
      - name: Verify live content
        id: verify
        run: |
          for i in $(seq 1 15); do
            sleep 20
            live=$(curl -fsS --max-time 15 "https://barabashflow.pl/build.json?run=${{ github.run_id }}-a$i" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('run_id',''))" 2>/dev/null || echo "")
            if [ "$live" = "${{ github.run_id }}" ]; then
              echo "live site serves this run (attempt $i)"; exit 0
            fi
            echo "attempt $i: live run_id='$live', want '${{ github.run_id }}'"
          done
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "live content still stale after ~5 min — redeploying"

      - name: Redeploy (stale live content)
        if: steps.verify.outputs.stale == 'true'
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
          timeout: 600000

      - name: Verify after redeploy
        if: steps.verify.outputs.stale == 'true'
        run: |
          for i in $(seq 1 15); do
            sleep 20
            live=$(curl -fsS --max-time 15 "https://barabashflow.pl/build.json?run=${{ github.run_id }}-b$i" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('run_id',''))" 2>/dev/null || echo "")
            if [ "$live" = "${{ github.run_id }}" ]; then
              echo "live site serves this run after redeploy (attempt $i)"; exit 0
            fi
            echo "attempt $i: live run_id='$live', want '${{ github.run_id }}'"
          done
          echo "::error::GitHub Pages still serves stale content after redeploy — investigate"
          exit 1
