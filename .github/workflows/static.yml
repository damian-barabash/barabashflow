name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Blog worker on the Mac Studio fires this after publishing new posts so the
  # static pages regenerate. The daily cron is a best-effort fallback (GH
  # schedules are unreliable) that picks up posts even without the dispatch.
  repository_dispatch:
    types: [blog-publish]
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages deployments intermittently fail server-side ("Deployment
        # failed, try again later") and succeed on a fresh attempt a moment
        # later — don't fail the run yet, retry below.
        continue-on-error: true
        with:
          error_count: 15
          timeout: 600000

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          error_count: 15
          timeout: 600000
